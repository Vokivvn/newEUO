 DNV.1.t:0 "Decade of Nader"
 DNV.1.d:0 "The "Decade of Nader," as some are calling it, began with the little-known Connecticut-born perennial candidate winning a tight election against Democrat Dean Barkley. An election so close that it led to the secession of the easternmost states left in the Denver Government. The first year of the Nader Administration were tumultuous, drawing international condemnation from the Reich for its Reunificationism policy with the Saint Louis Government. To Germany, the American Dream is dead. To Nader, it's just beginning. President Nader has already made great leaps to reform the once proud but flawed US of A. Improvements in healthcare, education, the whole lot. \n\nAnd he's not even finished. This year, the President announced his intention to open negotiations with the National Union of Dixie to finalize a peace treaty. A fitting end to the twenty-five-year conflict between the states of Dixie and Denver. A surprise even to President Pierce, who welcomed the news cautiously. The citizens of Dixie and Denver hope this could bring an era of peace after the devastating collapse of the United States. Something to bring people together, not tear them apart. But Nader knows, you have to know your enemy to beat your enemy. Discussion of the treaty is set to begin this week, and Dixie's ambassador David Duke is all over it. \n\nNader's 2012 campaign is also an integral part of his policy. Elections since '08 have been relatively closed off, as the administration worries about German interference. The 2012 Election is said to be free and fair. But if disaster strikes, Nader will have to make a tough decision. Keep Elections open, or close them to prevent foreign finagling. Despite all the problems and worries, the President considers this the time of the people. An era where the little guy doesn't get picked on, one where corporations have to pay their fair share. All the people can hope for, is he keeps to his promises."
 DNV.1.a:0 "The people are with us."
 DNV.2.t:0 "Go out and vote!"
 DNV.2.d:0 "Democracy: that which makes us free. Freer than the Reich, freer than Dixie. The foundation of civil society that we hold so dear. Our democracy has been stabbed in the back. Traitorous, German-sympathizing bastards led by the old guard broke off in Saint Louis. We remember -- and we won't forget. The Nazi War Machine is insistent on casting their sphere of influence over us. But one thing is for certain: they will never win. Denver's boys will get 'em and show 'em we are not to be messed with. \n\nNo matter what we do, think, or say, we must keep it crystal clear that we mean business. We must also make sure we keep ourselves safe. Safe from outsider meddling in our elections, and safe from the internal enemies who desire a return to big business and the dreadful two-party system we suffered through for far too long. \n\nSo we call on the masses to vote, to keep Nader in charge so he can fulfill every promise, drain whatever is left of D.C.'s swamp, and turn the remaining United States into the international gold standard. Only then do we have any chance to take on the Germans and Japanese. We must free our oppressed states from their tendrils."
 DNV.2.a:0 "Vote, Vote, Vote!"
 
 last_light_of_the_republic:0 "Last Light of the Republic"
 last_light_of_the_republic_desc:0 "The Denver Government is the last true remnant of a free America. The one piece they couldn't conquer. It is also home to one of the most democratic and free societies in the world. A nation not governed by corporations or feeble-minded career politicians. One governed by an administration that has the people's best interests at heart. One that exists to serve citizens. \n\nThe President's policies so far have won over public opinion, but have pushed away prominent figures in business. Those figures went on to found their own parties and factions within the government, and some have even aligned towards Germany. The remnants of the Democrat and Republican parties have also been a thorn in the side of the current administration. Doing everything they can to undermine Nader and his promises."
 government_in_exile:0 "Government in Exile"
 government_in_exile_desc:0 "The remainder of the USA is far, far from home. DC is deep behind enemy territory, and most of our government is split into many different pieces. We are fortunate enough to have many prominent exiles from the old government, along with many newcomers who wish to build America in Nader's image. Our status internationally as a government in exile has given us less legitimacy, but we are building ourselves back up."
 fortress_america:0 "Fortress America"
 fortress_america_desc:0 "America is our fortress, and Denver is our keep. President Nader has put immense effort into reforming the military, despite restrictions imposed by the Germanic barbarians. He found every loophole and every detail they missed. He did everything he could to build a strong enough force to defend against Dixie. \n\nAmerica would stand the test of time by any means necessary. Every fortress has its weakness, despite all of Nader's work. Any military–industrial complex would stand in the way of all of the President's progress. It would lead to the Denver Government becoming another military dictatorship like our neighbors down south."  
 dreams_of_reclamation:0 "Dreams of Reclamation"
 dreams_of_reclamation_desc:0 "The only thing keeping the government going is the hope that one day all of the former United States will be reunited under Denver's banner. A dream called "far-fetched" by prominent "intellectuals". Those with nothing better to do than pontificate on the matters at hand, rather than achieve anything. Not in Nader's America. Those "intellectuals" would be kicked to the curb in place of those who don't have such a defeatist attitude. People who wish to make the dreams of restoration and reclamation a reality. \n\nJust in the first year of Nader's administration have done everything possible to begin reunification. The opening of relations with Dixie, talks of unity with Saint Louis. Everything possible or necessary. An enormous wave is coming, a wave of liberty and freedom for all. And Nader can smell it. Soon enough the people of the eastern states will see that fascism is weak, and democracy is strong."
 crumbling_legitimacy:0 "Crumbling Legitimacy"
 crumbling_legitimacy_desc:0 "Despite all of our efforts, the government in denver is not internationally recognized. From Germania to Tokyo, Dixie or Pacifica are the golden children of the americas. The only thing standing in our way of a truly harmonious era. The nations of the world don't take us seriously, and something must be done to show them their mistake. we are still apower to be trifled with, despite the humiliations of the past."
 
 POLITICS_RALPH_NADER_DESC:0 "Ralph Nader is a man of many firsts. The first Arab-American President, the first truly left-wing President, and the first President to bring down the corporate masters of the former United States. President Nader has spent the first year of his administration tirelessly speaking out against international injustice, corporate greed at home, and the destructive power of politicians. Nearly every citizen of the Denver Government praises his efforts. Everyday he walks down the streets of Denver, he can't help but smile. Despite his jovial nature, he is still faced with many great crises. The market crash of 2008 being one of the major reasons for his succesful election saw him in less than a year reverse many of the tragedies brought about by economic depression. Less reliance on Japanese stocks and German automobiles, to name a few things. A truly new and United States were born, not to line the pockets of billionares, but to give your neighbor a fair share. \n\nA man like Nader is a man you can befriend. A President like no other, someone who really gets it. President Nader wants the common man to see him as an equal. The Great American Nation was born off of the backs of common men and women. It was born with the ideals of liberty, equality, and justice for all. And those ideals will not be tarnished by the stains of the twentieth century. We will have a new future, a future in Nader."