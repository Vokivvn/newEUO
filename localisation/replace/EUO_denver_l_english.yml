 DNV.1.t:0 "Decade of Nader"
 DNV.1.d:0 "The "Decade of Nader" as some are calling it began with the little-known Connecticut-born perennial candidate winning a tight election against Democrat Dean Barkley. An election so close that it led to the secession of the easternmost states left in the Denver Government. The first two years of the Nader Administration were tumultuous, seeing international condemnation from the Reich due to their policy of Reunificationism with the Saint Louis Government. To Germany, the American Dream is dead. To Nader, it's just beginning. President Nader has already made great leaps to reform the once proud but flawed US of A. Improvements in healhcare, education, the whole lot. \n\nAnd he's not even finished. As of this year the President has announced his intentions to open up negotiations with the National Union of Dixie, to finalize a peace treaty. A fitting end to the twenty-five year conflict between the states of Dixie and Denver."
 DNV.1.a:0 "Heil Pierce!"