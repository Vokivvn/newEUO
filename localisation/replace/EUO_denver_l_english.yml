 DNV.1.t:0 "Decade of Nader"
 DNV.1.d:0 "The "Decade of Nader," as some are calling it, began with the little-known Connecticut-born perennial candidate winning a tight election against Democrat Dean Barkley. An election so close that it led to the secession of the easternmost states left in the Denver Government. The first two years of the Nader Administration were tumultuous, drawing international condemnation from the Reich for its Reunificationism policy with the Saint Louis Government. To Germany, the American Dream is dead. To Nader, it's just beginning. President Nader has already made great leaps to reform the once proud but flawed US of A. Improvements in healthcare, education, the whole lot. \n\nAnd he's not even finished. This year, the President announced his intention to open negotiations with the National Union of Dixie to finalize a peace treaty. A fitting end to the twenty-five-year conflict between the states of Dixie and Denver. A surprise even to President Pierce, who welcomed the news cautiously. The citizens of Dixie and Denver hope this could bring an era of peace after the devastating collapse of the United States. Something to bring people together, not tear them apart. But Nader knows, you have to know your enemy to beat your enemy. Discussion of the treaty is set to begin this week, and Dixie's ambassador David Duke is all over it. \n\nNader's 2012 campaign is also an integral part of his policy. Elections since '08 have been relatively closed off, as the administration worries about German interference. The 2012 Election is said to be free and fair. But if disaster strikes, Nader will have to make a tough decision. Keep Elections open, or close them to prevent foreign finagling. Despite all the problems and worries, the President considers this the time of the people. An era where the little guy doesn't get picked on, one where corporations have to pay their fair share. All the people can hope for, is he keeps to his promises."
 DNV.1.a:0 "The people are with us."
 DNV.2.t:0 "Go out and vote!"
 DNV.2.d:0 "Democracy: that which makes us free. Freer than the Reich, freer than Dixie. The foundation of civil society that we hold so dear. Our democracy has been stabbed in the back. Traitorous, German-sympathizing bastards led by the old guard broke off in Saint Louis. We remember -- and we won't forget. The Nazi War Machine is insistent on casting their sphere of influence over us. But one thing is for certain: they will never win. Denver's boys will get 'em and show 'em we are not to be messed with. \n\nNo matter what we do, think, or say, we must keep it crystal clear that we mean business. We must also make sure we keep ourselves safe. Safe from outsider meddling in our elections, and safe from the internal enemies who desire a return to big business and the dreadful two-party system we suffered through for far too long. \n\nSo we call on the masses to vote, to keep Nader in charge so he can fulfill every promise, drain whatever is left of D.C.'s swamp, and turn the remaining United States into the international gold standard. Only then do we have any chance to take on the Germans and Japanese. We must free our oppressed states from their tendrils."
 DNV.2.a:0 "Vote, Vote, Vote!"