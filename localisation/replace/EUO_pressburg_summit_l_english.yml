 pressburg_summit.1.t:0 "The Pressburg Summit"
 pressburg_summit.1.d:0 "Come one, come all! Martin Adolf Bormann has announced that this year's summit on the state of the Pakt shall come to beautiful Bratislava, capital of the Slovak Republic. The nations of today are faced with a great deal of issues: the 2009 market crash, the ongoing Tuareg Rebellion, and the future of the Pakt being just some examples of the agenda of the summit. The 2010s have already proven to be a tumultuous period for even the most isolationist of nations. "
 pressburg_summit.1.a:0 "The Pressburg Summit"
